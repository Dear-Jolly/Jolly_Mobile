name: TestFlight

# develop 에 push 되면 iOS 빌드를 만들어 TestFlight 로 올린다.
on:
  push:
    branches: [develop]
  workflow_dispatch:

# 업로드가 겹치면 빌드 번호가 꼬이므로 한 번에 하나만 돌린다.
concurrency:
  group: testflight
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.4
  BUNDLE_ID: com.dearjolly.app
  APP_STORE_APP_ID: "6808617546"

jobs:
  deploy:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # 빌드 번호는 pubspec.yaml 을 건드리지 않고 스토어 상태에서 끌어온다.
      # 실행 번호로 만들면 워크플로를 다시 만들 때 1 로 리셋되어 충돌한다.
      - name: Resolve build number
        id: build_number
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_APP_ID: ${{ env.APP_STORE_APP_ID }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ascvenv"
          "$RUNNER_TEMP/ascvenv/bin/pip" install --quiet --disable-pip-version-check cryptography
          NEXT="$("$RUNNER_TEMP/ascvenv/bin/python" scripts/ci/next_build_number.py)"
          echo "다음 빌드 번호: $NEXT"
          echo "value=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Install signing assets
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          # 빌드 동안만 사는 임시 키체인에 배포 인증서를 넣는다.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          # 프로비저닝 프로파일은 Xcode 가 보는 두 경로에 모두 둔다.
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(plutil -extract UUID raw -o - "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(plutil -extract Name raw -o - "$RUNNER_TEMP/profile.plist")"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$PROFILE_UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $PROFILE_NAME ($PROFILE_UUID)"

      # Generated.xcconfig 생성, pod install, Dart 컴파일까지 여기서 끝난다.
      # 서명은 다음 단계의 xcodebuild 가 직접 지정하므로 여기선 하지 않는다.
      - name: Build Flutter iOS bundle
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ steps.build_number.outputs.value }}

      # 서명 설정은 Runner 타깃만 쓰는 xcconfig 에 넣는다.
      # xcodebuild 명령줄로 넘기면 Pods 와 SPM 타깃까지 적용되어
      # "does not support provisioning profiles" 로 아카이브가 실패한다.
      - name: Apply signing settings to the Runner target
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat >> ios/Flutter/Release.xcconfig <<CFG

          CODE_SIGN_IDENTITY=Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME
          DEVELOPMENT_TEAM=$TEAM_ID
          CFG

      # CODE_SIGN_STYLE 은 pbxproj 에 Automatic 으로 박혀 있어 xcconfig 로는
      # 덮이지 않는다. 명령줄로 넘겨야 하고, 이 설정은 Pods 를 깨지 않는다.
      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ env.BUNDLE_ID }}</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      # 업로드가 실패해도 IPA 는 남겨서 수동으로 올릴 수 있게 한다.
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: ipa-build-${{ steps.build_number.outputs.value }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # altool 은 이 경로들에서 AuthKey_<KEYID>.p8 을 찾는다.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"

          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' -maxdepth 1 | head -1)"
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8 || true
